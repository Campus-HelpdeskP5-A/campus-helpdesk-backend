name: Backend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check application files
        run: |
          test -f package.json
          test -f package-lock.json

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ghcr.io/campus-helpdeskp5-a/campus-helpdesk-backend:${{ github.sha }} .

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/campus-helpdeskp5-a/campus-helpdesk-backend:${{ github.sha }}
          docker tag ghcr.io/campus-helpdeskp5-a/campus-helpdesk-backend:${{ github.sha }} ghcr.io/campus-helpdeskp5-a/campus-helpdesk-backend:latest
          docker push ghcr.io/campus-helpdeskp5-a/campus-helpdesk-backend:latest
